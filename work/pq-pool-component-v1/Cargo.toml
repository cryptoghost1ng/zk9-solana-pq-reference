[package]
name = "zk9-hiding-balance-component"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
p3-air = { path = "../pq-pool-selection-v1/plonky3/air" }
p3-baby-bear = { path = "../pq-pool-selection-v1/plonky3/baby-bear" }
p3-challenger = { path = "../pq-pool-selection-v1/plonky3/challenger" }
p3-commit = { path = "../pq-pool-selection-v1/plonky3/commit" }
p3-dft = { path = "../pq-pool-selection-v1/plonky3/dft" }
p3-field = { path = "../pq-pool-selection-v1/plonky3/field" }
p3-fri = { path = "../pq-pool-selection-v1/plonky3/fri" }
p3-keccak = { path = "../pq-pool-selection-v1/plonky3/keccak" }
p3-matrix = { path = "../pq-pool-selection-v1/plonky3/matrix" }
p3-merkle-tree = { path = "../pq-pool-selection-v1/plonky3/merkle-tree" }
p3-symmetric = { path = "../pq-pool-selection-v1/plonky3/symmetric" }
p3-uni-stark = { path = "../pq-pool-selection-v1/plonky3/uni-stark" }
rand = { version = "=0.10.3", default-features = false, features = ["std", "std_rng", "sys_rng"] }
postcard = { version = "=1.1.3", features = ["alloc"], default-features = false }
serde_json = "=1.0.150"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug-assertions = false
overflow-checks = true
strip = "none"
