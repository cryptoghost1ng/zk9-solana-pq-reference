[package]
name = "zk9-public-bind-wire-lab"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
candidate = { package = "zk9-public-bind-proof-lab", path = "../pq-public-bind-proof-v1" }
old = { package = "zk9-private-send-lab", path = "../pq-private-send-v1" }
serde = "=1.0.229"
postcard = { version = "=1.1.3", features = ["alloc"], default-features = false }
serde_json = "=1.0.150"
p3-field = { path = "../pq-pool-selection-v1/plonky3/field" }
p3-air = { path = "../pq-pool-selection-v1/plonky3/air" }
p3-commit = { path = "../pq-pool-selection-v1/plonky3/commit" }
p3-challenger = { path = "../pq-pool-selection-v1/plonky3/challenger" }
p3-uni-stark = { path = "../pq-pool-selection-v1/plonky3/uni-stark" }
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug-assertions = false
overflow-checks = true
strip = "none"
