[package]
name="zk9-solana-beta-verifier"
version="0.1.0"
edition="2024"
publish=false
[workspace]
[lib]
crate-type=["cdylib"]
[dependencies]
solana-program="=2.3.0"
zk9-proof-staged={path="../../pq-proof-staged-v1"}
candidate={package="zk9-public-bind-prefix",path="../../pq-public-bind-prefix-v1"}
opening={package="zk9-public-bind-opening",path="../../pq-public-bind-sbf-packed-v1/crates/opening"}
fri={package="zk9-public-bind-fri",path="../../pq-public-bind-sbf-packed-v1/crates/fri"}
mmcs={package="zk9-public-bind-mmcs",path="../../pq-public-bind-sbf-packed-v1/crates/mmcs"}
arithmetic={package="zk9-public-bind-arithmetic",path="../../pq-public-bind-sbf-packed-v1/crates/arithmetic"}
round_mmcs={package="zk9-public-bind-round-mmcs",path="../../pq-public-bind-sbf-packed-v1/crates/round-mmcs"}
air={package="zk9-public-bind-air",path="../../pq-public-bind-sbf-packed-v1/crates/air"}
[features]
custom-heap=[]
custom-panic=[]
[profile.release]
lto="thin"
codegen-units=1
overflow-checks=true
