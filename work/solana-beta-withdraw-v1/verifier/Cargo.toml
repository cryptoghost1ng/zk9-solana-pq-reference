[package]
name="zk9-solana-withdraw-verifier"
version="0.1.0"
edition="2024"
publish=false
[workspace]
[lib]
crate-type=["cdylib"]
[dependencies]
solana-program="=2.3.0"
zk9-proof-staged={path="../../pq-proof-staged-v1"}
candidate={package="zk9-solana-withdraw-prefix",path="../crates/prefix"}
opening={package="zk9-solana-withdraw-opening",path="../crates/opening"}
fri={package="zk9-solana-withdraw-fri",path="../crates/fri"}
mmcs={package="zk9-solana-withdraw-mmcs",path="../crates/mmcs"}
arithmetic={package="zk9-solana-withdraw-arithmetic",path="../crates/arithmetic"}
round_mmcs={package="zk9-solana-withdraw-round-mmcs",path="../crates/round-mmcs"}
air={package="zk9-solana-withdraw-air",path="../crates/air"}
[features]
custom-heap=[]
custom-panic=[]
[profile.release]
lto="thin"
codegen-units=1
overflow-checks=true
